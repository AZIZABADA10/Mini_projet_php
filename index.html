<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Créer un étudiant — Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">
        <h1>Créer un étudiant</h1>
        <p class="lead">Remplissez les informations ci-dessous pour ajouter un nouvel étudiant.</p>

        <form id="studentForm" action="#" method="post" enctype="multipart/form-data">
            <section class="left">

                <div class="two field">
                    <div>
                        <label for="nom">Nom *</label>
                        <input id="nom" name="nom" type="text" required placeholder="Ex : Benali">
                    </div>
                    <div>
                        <label for="prenom">Prénom *</label>
                        <input id="prenom" name="prenom" type="text" required placeholder="Ex : Amal">
                    </div>
                </div>

                <div class="two field">
                    <div>
                        <label for="email">Email *</label>
                        <input id="email" name="email" type="email" required placeholder="exemple@mail.com">
                    </div>
                    <div>
                        <label for="telephone">Téléphone</label>
                        <input id="telephone" name="telephone" type="tel" placeholder="06XXXXXXXX"
                            pattern="[0-9+\-\s]{6,20}">
                    </div>
                </div>

                <div class="two field">
                    <div>
                        <label for="dob">Date de naissance</label>
                        <input id="dob" name="dob" type="date" max="2100-12-31">
                    </div>
                    <div>
                        <label for="niveau">Niveau</label>
                        <select id="niveau" name="niveau">
                            <option value="">-- Choisir --</option>
                            <option value="licence1">Licence 1</option>
                            <option value="licence2">Licence 2</option>
                            <option value="licence3">Licence 3</option>
                            <option value="master1">Master 1</option>
                            <option value="master2">Master 2</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="filiere">Filière</label>
                    <input id="filiere" name="filiere" type="text" placeholder="Informatique, Pharmacie, Droit...">
                </div>

                <div class="field">
                    <label for="adresse">Adresse</label>
                    <textarea id="adresse" name="adresse" placeholder="Rue, ville, code postal..."></textarea>
                </div>

            </section>

            <aside class="right">
                <div class="photo-preview" id="preview">
                    <div>
                        <strong>Photo de profil</strong>
                        <div class="small">Aucune image sélectionnée</div>
                    </div>
                </div>

                <div style="width:100%">
                    <label for="photo">Téléverser une photo</label>
                    <input id="photo" name="photo" type="file" accept="image/*">
                    <div class="note">jpg, png — taille recommandée : 400×400px</div>
                </div>

                <div style="width:100%" class="actions">
                    <button type="submit">Créer</button>
                    <button type="reset" class="secondary">Réinitialiser</button>
                </div>

            </aside>
        </form>

        <p class="note">* Champs obligatoires</p>
    </main>
    <script src="script.js"></script>
</body>

</html>
